<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071a0e"/>
      <stop offset="50%" style="stop-color:#0d2418"/>
      <stop offset="100%" style="stop-color:#0a1a0a"/>
    </linearGradient>
    <linearGradient id="chartLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="600"/>
  </g>

  <!-- Chart fill area -->
  <polygon points="100,420 200,390 320,350 420,310 500,270 580,230 680,200 760,170 860,155 960,140 1060,130 1100,128 1100,500 100,500"
           fill="url(#chartFill)"/>

  <!-- Main chart line -->
  <polyline points="100,420 200,390 320,350 420,310 500,270 580,230 680,200 760,170 860,155 960,140 1060,130 1100,128"
            fill="none" stroke="url(#chartLine)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Candlestick bars (subtle) -->
  <g opacity="0.2" fill="#10b981">
    <rect x="140" y="380" width="12" height="40"/>
    <rect x="170" y="370" width="12" height="30"/>
    <rect x="230" y="360" width="12" height="50"/>
    <rect x="260" y="345" width="12" height="35"/>
    <rect x="320" y="330" width="12" height="45"/>
    <rect x="350" y="295" width="12" height="40"/>
  </g>
  <g opacity="0.2" fill="#f59e0b">
    <rect x="200" y="390" width="12" height="20"/>
    <rect x="290" y="375" width="12" height="15"/>
  </g>

  <!-- Data points on line -->
  <g filter="url(#glow)">
    <circle cx="580" cy="230" r="5" fill="#10b981" opacity="0.8"/>
    <circle cx="760" cy="170" r="5" fill="#10b981" opacity="0.8"/>
    <circle cx="960" cy="140" r="6" fill="#f59e0b" opacity="0.9"/>
    <circle cx="1100" cy="128" r="7" fill="#10b981"/>
  </g>

  <!-- Arrow up -->
  <g transform="translate(530, 140)" filter="url(#glow)" opacity="0.5">
    <polygon points="70,80 70,20 50,20 85,0 120,20 100,20 100,80" fill="url(#chartLine)"/>
  </g>

  <!-- Glow -->
  <radialGradient id="orb" cx="70%" cy="40%" r="50%">
    <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1"/>
    <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
  </radialGradient>
  <ellipse cx="840" cy="240" rx="360" ry="200" fill="url(#orb)"/>

  <text x="600" y="548" font-family="monospace" font-size="13" fill="#10b981" opacity="0.5" text-anchor="middle" letter-spacing="6">AI AGENTS · NGX · US MARKETS · FINANCIAL APIs</text>
</svg>
