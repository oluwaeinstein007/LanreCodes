<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0505"/>
      <stop offset="50%" style="stop-color:#1a0808"/>
      <stop offset="100%" style="stop-color:#0a0514"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Binary / code rain (subtle) -->
  <g font-family="monospace" font-size="14" fill="#dc2626" opacity="0.06">
    <text x="60" y="80">01101000 01100101</text>
    <text x="300" y="50">11001010 00110101</text>
    <text x="600" y="70">10101010 11110000</text>
    <text x="850" y="55">01010111 10001100</text>
    <text x="1050" y="80">11110000 01101010</text>
    <text x="80" y="540">10001110 01010101</text>
    <text x="350" y="555">00110011 11001100</text>
    <text x="640" y="540">10110101 00111010</text>
    <text x="880" y="552">01101100 10100011</text>
  </g>

  <!-- Vault door rings -->
  <g transform="translate(600, 280)" filter="url(#glow)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.15"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.2"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.25"/>

    <!-- Vault bolts -->
    <g opacity="0.5" fill="none" stroke="url(#accent)" stroke-width="2">
      <circle cx="0" cy="-155" r="8"/>
      <circle cx="0" cy="155" r="8"/>
      <circle cx="-155" cy="0" r="8"/>
      <circle cx="155" cy="0" r="8"/>
      <circle cx="-110" cy="-110" r="7"/>
      <circle cx="110" cy="-110" r="7"/>
      <circle cx="-110" cy="110" r="7"/>
      <circle cx="110" cy="110" r="7"/>
    </g>

    <!-- Lock icon -->
    <rect x="-35" y="-10" width="70" height="55" rx="5" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.8"/>
    <path d="M -22,-10 L -22,-30 Q -22,-55 0,-55 Q 22,-55 22,-30 L 22,-10" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="20" r="9" fill="url(#accent)" opacity="0.7"/>
    <line x1="0" y1="29" x2="0" y2="40" stroke="url(#accent)" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- Spokes on vault door -->
  <g transform="translate(600, 280)" opacity="0.12" stroke="#f97316" stroke-width="1.5">
    <line x1="-130" y1="0" x2="130" y2="0"/>
    <line x1="0" y1="-130" x2="0" y2="130"/>
    <line x1="-92" y1="-92" x2="92" y2="92"/>
    <line x1="92" y1="-92" x2="-92" y2="92"/>
  </g>

  <!-- Key shape left -->
  <g transform="translate(180, 270)" opacity="0.18" fill="none" stroke="#f97316" stroke-width="2">
    <circle cx="0" cy="0" r="35"/>
    <circle cx="0" cy="0" r="18"/>
    <line x1="35" y1="0" x2="120" y2="0"/>
    <line x1="90" y1="0" x2="90" y2="20"/>
    <line x1="110" y1="0" x2="110" y2="15"/>
  </g>

  <!-- Key shape right -->
  <g transform="translate(1020, 270) scale(-1,1)" opacity="0.18" fill="none" stroke="#f97316" stroke-width="2">
    <circle cx="0" cy="0" r="35"/>
    <circle cx="0" cy="0" r="18"/>
    <line x1="35" y1="0" x2="120" y2="0"/>
    <line x1="90" y1="0" x2="90" y2="20"/>
    <line x1="110" y1="0" x2="110" y2="15"/>
  </g>

  <!-- Glow -->
  <radialGradient id="orb" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.1"/>
    <stop offset="100%" style="stop-color:#f97316;stop-opacity:0"/>
  </radialGradient>
  <ellipse cx="600" cy="280" rx="280" ry="220" fill="url(#orb)"/>

  <text x="600" y="548" font-family="monospace" font-size="13" fill="#f97316" opacity="0.5" text-anchor="middle" letter-spacing="6">LARAVEL · MYSQL · PHPUNIT · SECRETS MANAGEMENT</text>
</svg>
