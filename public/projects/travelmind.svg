<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050d1a"/>
      <stop offset="40%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a0a05"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Sky gradient overlay -->
  <rect width="1200" height="600" fill="url(#sky)" opacity="0.4"/>

  <!-- Stars -->
  <g fill="white" opacity="0.4">
    <circle cx="100" cy="80" r="1.5"/>
    <circle cx="230" cy="40" r="1"/>
    <circle cx="380" cy="90" r="1.5"/>
    <circle cx="520" cy="30" r="1"/>
    <circle cx="670" cy="70" r="1.5"/>
    <circle cx="820" cy="45" r="1"/>
    <circle cx="950" cy="85" r="1.5"/>
    <circle cx="1080" cy="35" r="1"/>
    <circle cx="160" cy="130" r="1"/>
    <circle cx="440" cy="140" r="1.5"/>
    <circle cx="750" cy="120" r="1"/>
    <circle cx="1020" cy="145" r="1.5"/>
  </g>

  <!-- Horizon glow -->
  <radialGradient id="horizon" cx="50%" cy="100%" r="60%">
    <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.35"/>
    <stop offset="100%" style="stop-color:#f97316;stop-opacity:0"/>
  </radialGradient>
  <rect x="0" y="300" width="1200" height="300" fill="url(#horizon)"/>

  <!-- Flight path arc -->
  <path d="M 80,460 Q 600,80 1120,460" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="12,8" opacity="0.4" filter="url(#glow)"/>

  <!-- Airplane icon -->
  <g transform="translate(588, 175) rotate(-30)" filter="url(#glow)">
    <polygon points="0,-18 6,6 0,3 -6,6" fill="white" opacity="0.9"/>
    <polygon points="-14,2 14,2 12,7 -12,7" fill="white" opacity="0.7"/>
    <polygon points="-6,8 6,8 5,12 -5,12" fill="white" opacity="0.5"/>
  </g>

  <!-- Location pins -->
  <g filter="url(#glow)" opacity="0.7">
    <!-- Origin -->
    <circle cx="80" cy="460" r="8" fill="#f97316"/>
    <line x1="80" y1="430" x2="80" y2="460" stroke="#f97316" stroke-width="2"/>
    <!-- Destination -->
    <circle cx="1120" cy="460" r="8" fill="#0ea5e9"/>
    <line x1="1120" y1="430" x2="1120" y2="460" stroke="#0ea5e9" stroke-width="2"/>
  </g>

  <!-- Compass rose (subtle) -->
  <g transform="translate(960, 200)" opacity="0.12" stroke="#0ea5e9" stroke-width="1.5" fill="none">
    <circle cx="0" cy="0" r="60"/>
    <circle cx="0" cy="0" r="40"/>
    <line x1="0" y1="-60" x2="0" y2="60"/>
    <line x1="-60" y1="0" x2="60" y2="0"/>
    <line x1="-42" y1="-42" x2="42" y2="42"/>
    <line x1="42" y1="-42" x2="-42" y2="42"/>
    <polygon points="0,-55 -6,-30 0,-38 6,-30" fill="#0ea5e9" opacity="0.5"/>
  </g>

  <!-- Glow orb -->
  <radialGradient id="orb" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.08"/>
    <stop offset="100%" style="stop-color:#f97316;stop-opacity:0"/>
  </radialGradient>
  <ellipse cx="600" cy="300" rx="400" ry="250" fill="url(#orb)"/>

  <text x="600" y="548" font-family="monospace" font-size="13" fill="#0ea5e9" opacity="0.5" text-anchor="middle" letter-spacing="6">LLM · AI AGENTS · ITINERARY PLANNING · NEXT.JS</text>
</svg>
