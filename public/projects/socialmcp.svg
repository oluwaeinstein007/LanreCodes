<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0a1f"/>
      <stop offset="50%" style="stop-color:#1a0e35"/>
      <stop offset="100%" style="stop-color:#0a0e1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Network node connections -->
  <g opacity="0.12" stroke="#8b5cf6" stroke-width="1.5" fill="none">
    <!-- Hub to nodes -->
    <line x1="600" y1="290" x2="200" y2="150"/>
    <line x1="600" y1="290" x2="400" y2="100"/>
    <line x1="600" y1="290" x2="800" y2="100"/>
    <line x1="600" y1="290" x2="1000" y2="150"/>
    <line x1="600" y1="290" x2="200" y2="430"/>
    <line x1="600" y1="290" x2="400" y2="490"/>
    <line x1="600" y1="290" x2="800" y2="490"/>
    <line x1="600" y1="290" x2="1000" y2="430"/>
    <!-- Cross connections -->
    <line x1="200" y1="150" x2="400" y2="100"/>
    <line x1="800" y1="100" x2="1000" y2="150"/>
    <line x1="200" y1="430" x2="400" y2="490"/>
    <line x1="800" y1="490" x2="1000" y2="430"/>
  </g>

  <!-- Outer nodes -->
  <g filter="url(#glow)">
    <!-- WhatsApp node -->
    <circle cx="200" cy="150" r="30" fill="#075e54" opacity="0.7"/>
    <text x="200" y="155" font-family="sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.9">W</text>

    <!-- Telegram node -->
    <circle cx="400" cy="100" r="30" fill="#229ED9" opacity="0.7"/>
    <text x="400" y="105" font-family="sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.9">T</text>

    <!-- X/Twitter node -->
    <circle cx="800" cy="100" r="30" fill="#1d9bf0" opacity="0.7"/>
    <text x="800" y="105" font-family="sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.9">X</text>

    <!-- npm node -->
    <circle cx="1000" cy="150" r="30" fill="#cb3837" opacity="0.7"/>
    <text x="1000" y="155" font-family="sans-serif" font-size="14" fill="white" text-anchor="middle" opacity="0.9">npm</text>

    <!-- AI node left -->
    <circle cx="200" cy="430" r="25" fill="#8b5cf6" opacity="0.5"/>
    <text x="200" y="435" font-family="monospace" font-size="11" fill="white" text-anchor="middle" opacity="0.8">AI</text>

    <!-- MCP node -->
    <circle cx="400" cy="490" r="25" fill="#ec4899" opacity="0.5"/>
    <text x="400" y="495" font-family="monospace" font-size="10" fill="white" text-anchor="middle" opacity="0.8">MCP</text>

    <!-- Agent node -->
    <circle cx="800" cy="490" r="25" fill="#8b5cf6" opacity="0.5"/>
    <text x="800" y="495" font-family="monospace" font-size="10" fill="white" text-anchor="middle" opacity="0.8">BOT</text>

    <!-- TS node -->
    <circle cx="1000" cy="430" r="25" fill="#3178c6" opacity="0.5"/>
    <text x="1000" y="435" font-family="monospace" font-size="10" fill="white" text-anchor="middle" opacity="0.8">TS</text>
  </g>

  <!-- Central hub -->
  <radialGradient id="hub" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.4"/>
    <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.05"/>
  </radialGradient>
  <circle cx="600" cy="290" r="60" fill="url(#hub)" stroke="url(#accent)" stroke-width="2" filter="url(#glow)"/>
  <text x="600" y="285" font-family="monospace" font-size="13" fill="white" text-anchor="middle" opacity="0.9" font-weight="bold">MCP</text>
  <text x="600" y="303" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="middle" opacity="0.8">SOCIAL</text>

  <!-- Glow -->
  <radialGradient id="orb" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
    <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0"/>
  </radialGradient>
  <ellipse cx="600" cy="290" rx="320" ry="220" fill="url(#orb)"/>

  <text x="600" y="552" font-family="monospace" font-size="13" fill="#8b5cf6" opacity="0.5" text-anchor="middle" letter-spacing="6">WHATSAPP · TELEGRAM · X (TWITTER) · NPM PACKAGE</text>
</svg>
