<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0d2137"/>
      <stop offset="100%" style="stop-color:#0a2a1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Hexagonal grid pattern -->
  <g opacity="0.07" stroke="#00d4aa" stroke-width="1" fill="none">
    <polygon points="100,50 150,80 150,140 100,170 50,140 50,80"/>
    <polygon points="200,50 250,80 250,140 200,170 150,140 150,80"/>
    <polygon points="300,50 350,80 350,140 300,170 250,140 250,80"/>
    <polygon points="400,50 450,80 450,140 400,170 350,140 350,80"/>
    <polygon points="500,50 550,80 550,140 500,170 450,140 450,80"/>
    <polygon points="600,50 650,80 650,140 600,170 550,140 550,80"/>
    <polygon points="700,50 750,80 750,140 700,170 650,140 650,80"/>
    <polygon points="800,50 850,80 850,140 800,170 750,140 750,80"/>
    <polygon points="900,50 950,80 950,140 900,170 850,140 850,80"/>
    <polygon points="1000,50 1050,80 1050,140 1000,170 950,140 950,80"/>
    <polygon points="1100,50 1150,80 1150,140 1100,170 1050,140 1050,80"/>

    <polygon points="50,170 100,200 100,260 50,290 0,260 0,200"/>
    <polygon points="150,170 200,200 200,260 150,290 100,260 100,200"/>
    <polygon points="250,170 300,200 300,260 250,290 200,260 200,200"/>
    <polygon points="350,170 400,200 400,260 350,290 300,260 300,200"/>
    <polygon points="450,170 500,200 500,260 450,290 400,260 400,200"/>
    <polygon points="550,170 600,200 600,260 550,290 500,260 500,200"/>
    <polygon points="650,170 700,200 700,260 650,290 600,260 600,200"/>
    <polygon points="750,170 800,200 800,260 750,290 700,260 700,200"/>
    <polygon points="850,170 900,200 900,260 850,290 800,260 800,200"/>
    <polygon points="950,170 1000,200 1000,260 950,290 900,260 900,200"/>
    <polygon points="1050,170 1100,200 1100,260 1050,290 1000,260 1000,200"/>
    <polygon points="1150,170 1200,200 1200,260 1150,290 1100,260 1100,200"/>

    <polygon points="100,290 150,320 150,380 100,410 50,380 50,320"/>
    <polygon points="300,290 350,320 350,380 300,410 250,380 250,320"/>
    <polygon points="500,290 550,320 550,380 500,410 450,380 450,320"/>
    <polygon points="700,290 750,320 750,380 700,410 650,380 650,320"/>
    <polygon points="900,290 950,320 950,380 900,410 850,380 850,320"/>
    <polygon points="1100,290 1150,320 1150,380 1100,410 1050,380 1050,320"/>

    <polygon points="50,410 100,440 100,500 50,530 0,500 0,440"/>
    <polygon points="150,410 200,440 200,500 150,530 100,500 100,440"/>
    <polygon points="350,410 400,440 400,500 350,530 300,500 300,440"/>
    <polygon points="550,410 600,440 600,500 550,530 500,500 500,440"/>
    <polygon points="750,410 800,440 800,500 750,530 700,500 700,440"/>
    <polygon points="950,410 1000,440 1000,500 950,530 900,500 900,440"/>
    <polygon points="1150,410 1200,440 1200,500 1150,530 1100,500 1100,440"/>
  </g>

  <!-- Central shield icon -->
  <g transform="translate(480, 150)" filter="url(#glow)">
    <path d="M120,0 L240,50 L240,150 Q240,230 120,270 Q0,230 0,150 L0,50 Z" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
    <path d="M120,30 L210,70 L210,150 Q210,210 120,245 Q30,210 30,150 L30,70 Z" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
    <!-- Checkmark -->
    <polyline points="75,140 105,170 165,110" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Connecting lines / circuit paths -->
  <g opacity="0.15" stroke="#00d4aa" stroke-width="1" fill="none">
    <line x1="0" y1="300" x2="480" y2="300"/>
    <line x1="720" y1="300" x2="1200" y2="300"/>
    <circle cx="480" cy="300" r="4" fill="#00d4aa"/>
    <circle cx="720" cy="300" r="4" fill="#00d4aa"/>
    <line x1="600" y1="0" x2="600" y2="148"/>
    <line x1="600" y1="422" x2="600" y2="600"/>
  </g>

  <!-- Glowing orb -->
  <radialGradient id="orb" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.15"/>
    <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0"/>
  </radialGradient>
  <ellipse cx="600" cy="290" rx="280" ry="200" fill="url(#orb)"/>

  <!-- Label -->
  <text x="600" y="500" font-family="monospace" font-size="13" fill="#00d4aa" opacity="0.5" text-anchor="middle" letter-spacing="6">AI · SAFETY · COMPLIANCE · MULTI-AGENT</text>
</svg>
