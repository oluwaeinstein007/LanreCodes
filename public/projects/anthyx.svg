<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#150a28"/>
      <stop offset="50%" style="stop-color:#1a0f30"/>
      <stop offset="100%" style="stop-color:#0a0a20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Faint grid -->
  <g opacity="0.06" stroke="#a855f7" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="350" y1="0" x2="350" y2="600"/>
    <line x1="550" y1="0" x2="550" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="950" y1="0" x2="950" y2="600"/>
    <line x1="1150" y1="0" x2="1150" y2="600"/>
  </g>

  <!-- Glow orb behind hub -->
  <radialGradient id="orb" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.18"/>
    <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
  </radialGradient>
  <ellipse cx="600" cy="290" rx="320" ry="220" fill="url(#orb)"/>

  <!-- Spokes connecting hub to platform nodes -->
  <g stroke="url(#accent)" stroke-width="1.5" opacity="0.35">
    <line x1="600" y1="290" x2="260" y2="120"/>
    <line x1="600" y1="290" x2="600" y2="90"/>
    <line x1="600" y1="290" x2="940" y2="120"/>
    <line x1="600" y1="290" x2="220" y2="290"/>
    <line x1="600" y1="290" x2="980" y2="290"/>
    <line x1="600" y1="290" x2="260" y2="460"/>
    <line x1="600" y1="290" x2="600" y2="490"/>
    <line x1="600" y1="290" x2="940" y2="460"/>
  </g>

  <!-- Platform nodes -->
  <g fill="url(#accent)" filter="url(#glow)" opacity="0.85">
    <circle cx="260" cy="120" r="7"/>
    <circle cx="600" cy="90" r="7"/>
    <circle cx="940" cy="120" r="7"/>
    <circle cx="220" cy="290" r="7"/>
    <circle cx="980" cy="290" r="7"/>
    <circle cx="260" cy="460" r="7"/>
    <circle cx="600" cy="490" r="7"/>
    <circle cx="940" cy="460" r="7"/>
  </g>

  <!-- Central hub: brand nucleus -->
  <g transform="translate(600,290)" filter="url(#glow)">
    <circle r="64" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>
    <circle r="44" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
    <circle r="20" fill="url(#accent)" opacity="0.9"/>
  </g>

  <!-- Orbiting agent pipeline markers -->
  <g fill="#6366f1" opacity="0.7">
    <circle cx="600" cy="226" r="4"/>
    <circle cx="664" cy="290" r="4"/>
    <circle cx="600" cy="354" r="4"/>
    <circle cx="536" cy="290" r="4"/>
  </g>

  <text x="600" y="548" font-family="monospace" font-size="13" fill="#a855f7" opacity="0.55" text-anchor="middle" letter-spacing="6">AI AGENTS · BRAND OPS · MULTI-PLATFORM · SAAS</text>
</svg>
